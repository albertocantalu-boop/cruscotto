<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Accesso riservato</title>
<style>
:root{--acid:#b0f021;--dark:#1a1c1e;--panel:#232629;--border:#3a3f45;--text:#e8eaed;--muted:#8a9099;--red:#ff6b6b}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--dark);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;
     min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.box{background:var(--panel);border:1px solid var(--border);border-radius:12px;
     padding:32px;width:100%;max-width:360px;text-align:center}
.logo{width:44px;height:44px;background:var(--acid);border-radius:10px;margin:0 auto 18px;
      display:flex;align-items:center;justify-content:center;font-size:22px}
h1{font-size:17px;font-weight:700;margin-bottom:6px;letter-spacing:-.3px}
p{font-size:13px;color:var(--muted);margin-bottom:20px;line-height:1.5}
input{width:100%;background:var(--dark);border:1px solid var(--border);border-radius:8px;
      color:var(--text);font-size:16px;padding:12px 14px;margin-bottom:12px;text-align:center}
input:focus{outline:none;border-color:var(--acid)}
button{width:100%;background:var(--acid);color:var(--dark);border:none;border-radius:8px;
       font-size:15px;font-weight:700;padding:12px;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.err{color:var(--red);font-size:13px;margin-top:12px;min-height:18px}
</style>
</head>
<body>
<div class="box">
  <div class="logo">&#128176;</div>
  <h1>Finanze di famiglia</h1>
  <p>Inserisci la password per vedere il cruscotto.</p>
  <form id="f">
    <input type="password" id="pw" placeholder="Password" autocomplete="current-password" autofocus>
    <button type="submit" id="go">Entra</button>
  </form>
  <div class="err" id="err"></div>
</div>

const byte = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function apri(password) {
  const base = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  const chiave = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:byte(SALE), iterations:GIRI, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const chiaro = await crypto.subtle.decrypt(
    {name:'AES-GCM', iv:byte(IV)}, chiave, byte(DATI));
  return new TextDecoder().decode(chiaro);
}

document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const bottone = document.getElementById('go'), errore = document.getElementById('err');
  bottone.disabled = true; bottone.textContent = 'Apertura...'; errore.textContent = '';
  try {
    const html = await apri(document.getElementById('pw').value);
    document.open(); document.write(html); document.close();
  } catch (_) {
    // AES-GCM fallisce l'autenticazione: password sbagliata (o file corrotto)
    errore.textContent = 'Password errata.';
    bottone.disabled = false; bottone.textContent = 'Entra';
    document.getElementById('pw').select();
  }
});
</script>
